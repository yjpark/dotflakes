[settings]
disable_tools = ["*"]

[tasks._activate-home]
description = "Activate Home Manager config"
depends = ["vcs-status"]
run = "nix run"

[tasks._beans-serve]
description = "Start beans server"
run = 'beans-serve --cors-origin "*"'

[tasks.vcs-status]
description = "Show VCS status"
hide = true
run = """
if command -v jj &>/dev/null && [ -d .jj ]; then
    jj status
else
    git status
fi
"""

[tasks.show]
description = "Show flake outputs"
depends = ["vcs-status"]
run = "om show ."

[tasks.flake-lock-niri]
description = "Lock niri input"
run = "nix flake update niri"

[tasks.flake-update-llm-agents]
description = "Update llm-agents input"
run = "nix flake update llm-agents"
depends_post = ["vcs-status"]

[tasks.flake-update]
description = "Update flake inputs"
run = "nix flake update {{arg(name='inputs', var=true, default='')}}"
depends_post = ["vcs-status"]

[tasks.flake-reset]
description = "Reset flake lock (fixes nurHash issues)"
run = """
rm flake.lock
nix flake update
jj new
"""

[tasks.build-host]
description = "Build NixOS config for current host"
depends = ["vcs-status"]
run = "nixos-rebuild {{arg(name='command', default='build')}} --flake .#$(hostname)"

[tasks._switch-host]
description = "Switch NixOS config (requires sudo)"
depends = ["vcs-status"]
run = """
nixos-rebuild build --flake .#$(hostname)
SYSTEM_PATH=$(readlink -f result)
rm -f result
sudo nix-env -p /nix/var/nix/profiles/system --set "$SYSTEM_PATH"
sudo "$SYSTEM_PATH/bin/switch-to-configuration" switch
if systemctl list-unit-files onecli-init-ca-and-secrets.service &>/dev/null; then
  echo "Starting onecli-init-ca-and-secrets (check progress: journalctl -fu onecli-init-ca-and-secrets)..."
  sudo systemctl start onecli-init-ca-and-secrets || true
else
  echo "Skipping onecli-init-ca-and-secrets (service not found on this host)"
fi
"""

[tasks.restart-onecli]
description = "Restart OneCLI containers (use after image update)"
run = """
sudo systemctl restart podman-onecli-postgres podman-onecli
echo "Starting onecli-init-ca-and-secrets (check progress: journalctl -fu onecli-init-ca-and-secrets)..."
sudo systemctl start onecli-init-ca-and-secrets
"""

[tasks.build-container]
description = "Build and import a container LXC image into incus"
usage = '''
arg "<container>" {
  choices "yolo" "spacebot" "hermes" "onecli" "searxng"
}
'''
run = """
CONTAINER={{arg(name='container')}}
nixos-rebuild build-image --image-variant lxc-metadata --flake .#$CONTAINER
METADATA=$(readlink -f result/tarball/*.tar.xz)
rm result
nixos-rebuild build-image --image-variant lxc --flake .#$CONTAINER
IMAGE=$(readlink -f result/tarball/*.tar.xz)
rm result
incus image import "$METADATA" "$IMAGE" --alias "$CONTAINER"
incus image list | grep "$CONTAINER"
"""

[tasks.flake-update-jig]
description = "Update jig input to latest"
run = "nix flake update jig"
depends_post = ["vcs-status"]

[tasks.flake-override-jig-local]
description = "Override jig with local path (for development)"
run = "nix flake lock --override-input jig path:/home/yj/agents/edger/jig"
depends_post = ["vcs-status"]

[tasks.update-mdbook-beans]
description = "Update mdbook-beans to latest main"
run = "nix flake update mdbook-beans"

[tasks.docs-serve]
description = "Serve docs locally (hot-reload)"
run = "nix run .#docs-serve -- --port 8812 --hostname 0.0.0.0"

[tasks.docs-build]
description = "Build static docs site"
run = "nix build .#docs"

[tasks.test-echo]
description = "Echo a message (for testing tv-mise-tasks)"
run = "echo {{arg(name='message')}}"
